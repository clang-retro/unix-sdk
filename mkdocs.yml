# The documentation site: https://clang-retro.github.io/unix-sdk/
# Build it with `pip install -r .docs/requirements.txt` and `mkdocs serve`.
INHERIT: .docs/base.yml
site_name: UNIX SDK
site_description: Programs for SGI IRIX, Solaris and other classic UNIX systems with clang
site_url: https://clang-retro.github.io/unix-sdk/
repo_url: https://github.com/clang-retro/unix-sdk
repo_name: clang-retro/unix-sdk
edit_uri: ""
hooks:
  - .docs/hooks.py

extra:
  retro:
    github: clang-retro/unix-sdk
    branch: main
    pages:
      README.md: index.md
      README.md#license: license.md
      irix/README.md: irix.md
      solaris/README.md: solaris.md
      CONTRIBUTING.md: contributing.md

nav:
  - "Home": index.md
  - "IRIX":
      - "Overview": irix.md
      - "Using the SDK": irix-using.md
      - "Running programs": irix-running.md
      - "IRIX's own libraries": irix-native.md
  - "Solaris":
      - "Overview": solaris.md
      - "Using the SDK": solaris-using.md
      - "Running programs": solaris-running.md
  - "Contributing": contributing.md
  - "License": license.md
  - "All clang-retro projects": https://clang-retro.github.io/
